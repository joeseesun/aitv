name = "aitv"
main = "src/worker.js"
compatibility_date = "2026-09-01"
routes = [{ pattern = "aitv.qiaomu.ai", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/audio/*", "/img/*"]

# 节目单指针和各版本 seed 放 KV；音频放 R2（支持 Range）
[[kv_namespaces]]
binding = "SCHEDULE"
id = "35456d05bca74c6390acb8af52f0ef89"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "aitv-audio"

# 定时流水线（src/pipeline.js）：每 15 分钟一轮。密钥用 wrangler secret：DEEPSEEK_API_KEY、DOUBAO_TTS_ACCESS_TOKEN
[triggers]
crons = ["*/15 * * * *"]

[vars]
BRIEF_MODEL = "deepseek-flash"
SCRIPT_MODEL = "deepseek-flash"
AUTO_PUBLISH = "1"               # 乔木 2026-10-09 13:34 批准「开自动上台」：做好的条目经 switchAt 插进时间线
# 榜单类按上榜时间算新鲜度（PH = 日榜结束、GitHub = 第一次在 trending 看到）；"none" 全关 → 按 publishedAt
RANKED_SOURCES = "producthunt,github"
PIPELINE_MAX_NEW_PER_DAY = "40"  # 一天最多 40 条；每轮最多 2 条，在播有效条目 >= 12 时每轮 1 条（src/pipeline.js 常量）
TTS_DAILY_CAP = "40"
